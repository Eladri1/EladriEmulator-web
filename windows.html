<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 95 - Sr. Croquetas 💻</title>
    <style>
        body {
            background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        .btn-volver {
            position: absolute; top: 20px; left: 20px; background: #16161a; border: 1px solid #333;
            color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;
            text-decoration: none; z-index: 10;
        }
        .btn-volver:hover { border-color: #0078d7; }

        #emulator-container {
            width: 800px; height: 600px; max-width: 95vw; max-height: 85vh;
            border-radius: 6px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            background: #000; border: 2px solid #222;
        }
        #screen_container { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <a href="index.html" class="btn-volver">← Volver al menú</a>

    <div id="emulator-container">
        <div id="screen_container">
            <div style="white-space: pre; font-family: monospace;"></div>
            <canvas style="display: none"></canvas>
        </div>
    </div>

    <!-- Librería v86 oficial -->
    <script src="https://cdn.jsdelivr.net/gh/copy/v86@master/build/libv86.js"></script>
    <script>
        window.onload = function() {
            window.emulator = new V86Starter({
                screen_container: document.getElementById("screen_container"),
                wasm_path: "https://cdn.jsdelivr.net/gh/copy/v86@master/build/v86.wasm",
                bios: {
                    url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/seabios.bin",
                },
                vga_bios: {
                    url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/vgabios.bin",
                },
                // Usamos la URL directa del disco de Win95 optimizado para v86
                hda: {
                    url: "https://copy.sh/v86/images/windows95.img",
                    async: true,
                },
                memory_size: 128 * 1024 * 1024, // 128MB
                vga_memory_size: 8 * 1024 * 1024,
                autostart: true,
            });
        };
    </script>
</body>
</html>
